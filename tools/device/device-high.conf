# Profile: HIGH — everything the art direction wants, to find out what it costs.
viewing_range = 100
smooth_lighting = true
mip_map = false
bilinear_filter = false
trilinear_filter = false
anisotropic_filter = false
enable_waving_leaves = true
enable_waving_water = true
enable_waving_plants = true
enable_post_processing = true
enable_bloom = false
# Dynamic shadows are measured as a SEPARATE fourth run, not as part of high:
# they are the single most likely thing to be unaffordable, and folding them in
# would lose the information of how much the rest costs without them.
enable_dynamic_shadows = false
enable_shaders = true
fps_max = 60
