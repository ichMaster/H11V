# Profile: LOW — the floor. What the device can do when asked for the least.
viewing_range = 40
smooth_lighting = false
mip_map = false
bilinear_filter = false
trilinear_filter = false
anisotropic_filter = false
enable_waving_leaves = false
enable_waving_water = false
enable_waving_plants = false
enable_post_processing = false
enable_bloom = false
enable_dynamic_shadows = false
# 5.10 still honours this; on the Mac (5.17) shaders are mandatory and the key is
# ignored. The shaders axis therefore exists only on the device, which is the
# only place a measurement counts. See docs/decisions.md.
enable_shaders = false
# fps_max is the SHIPPING cap, and it is also a trap for v0.7: with it in place
# every profile reports a frame rate equal to the cap and tells us nothing about
# what the device can do. tools/measure_device.sh raises it for the duration of a
# measurement, and `drawtime` — the actual per-frame render cost, which no cap
# affects — is the number worth recording either way.
fps_max = 30
