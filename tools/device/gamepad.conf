# H11V — the PocketTerm35's gamepad buttons.
#
# DEVICE ONLY. Appended by tools/deploy_to_term35.sh and never by run_local.sh,
# because these bindings take W/A/S/D away and the Mac needs them.
#
# What the buttons actually are, established on this hardware rather than
# assumed: every one of them sends an ordinary keyboard key. There is no BTN_*
# anywhere, /proc/bus/input/devices lists no joystick, and the twelve gamepad
# codes the keyboard advertises in its capability bitmap are never used. So this
# is a keymap, not a joystick configuration, and Luanti needs no joypad path.
#
#   A 30 · B 48 · X 45 · Y 21 · L 38 · R 19  — each sends the letter on its face
#   Select 99  = SysRq  (KEY_SNAPSHOT)
#   Start  119 = Pause  (KEY_PAUSE)
#   D-pad 103/108/105/106 = the arrow keys
#
# Luanti binds one key per action — there is no secondary binding — so these
# REPLACE the desktop keys rather than joining them. That is why the file is
# device-only: on the panel the D-pad is how you move, and on the Mac W/A/S/D is.

# --- movement: the D-pad ------------------------------------------------------
# Takes W/A/S/D off these actions. Note that A and D were LEFT and RIGHT by
# default, which is exactly why A can now be jump without a collision.
keymap_forward = KEY_UP
keymap_backward = KEY_DOWN
keymap_left = KEY_LEFT
keymap_right = KEY_RIGHT

# --- the face buttons ---------------------------------------------------------
# A at the bottom of the diamond is jump, as it is on every handheld ever made.
keymap_jump = KEY_KEY_A
keymap_sneak = KEY_KEY_B
# X places and Y digs: the two things this game is, on the two buttons a right
# thumb reaches without moving.
keymap_place = KEY_KEY_X
keymap_dig = KEY_KEY_Y

# --- shoulders: turning the view ----------------------------------------------
# Looking around is a finger drag, which is the same gesture as aiming before a
# tap — the two fight each other. Shoulder buttons for yaw is what handhelds
# settled on long ago.
#
# Luanti has no key binding for the camera: keymap_* covers movement, strafing,
# digging and menus, and looking belongs to the mouse and the touchscreen. So the
# rotation is done in games/h11v/mods/h11_world/turn.lua, and these two bindings
# exist only to get the buttons somewhere a mod can observe them —
# get_player_control() reports a fixed set, of which `zoom` and `aux1` are the
# two that are free in v0. Nothing here zooms or sprints; the binding is a
# transport, not a meaning.
keymap_zoom = KEY_KEY_L
keymap_aux1 = KEY_KEY_R

# A transport must do nothing of its own, and neither of these did at first: L
# turned AND zoomed the camera, R turned AND could sprint. Both are dealt with —
# but only one of them is dealt with HERE, and this comment used to say otherwise.
#
# THE ZOOM IS NOT A CLIENT SETTING. `zoom_fov = 72` stood on the next line and was
# inert: zoom_fov is a player OBJECT PROPERTY in the Lua API (lua_api.md, Object
# properties) and no such config key exists, so the engine ignored the line the
# way it ignores any unknown setting. That is also the real reason "zoom_fov equal
# to fov" was measured on the device and did NOT stop the zoom (docs/decisions.md,
# v0.7.1 "Turning on L/R, and why it costs a flash"); the line has been removed
# rather than left in, because a setting that does nothing reads as a setting that
# does something.
#
# The zoom is taken away by the game instead, in two places, and NEITHER of them
# is redundant — do not delete one on the strength of a comment in this file:
#   * games/h11v/mods/h11_world/player.lua sets the zoom_fov PROPERTY to 0 on
#     join, which is what the engine documents as disabling zoom for a player;
#   * games/h11v/mods/h11_world/turn.lua pins the FOV with set_fov while the
#     button is held. It asks nothing of the client and is what still holds if
#     anything ever hands the property back.
#
# fov stays, and is the engine's own default written down: the three graphics
# profiles were measured at 72 degrees, and the field of view decides how much
# geometry is in frame, so a device quietly running at another FOV would be
# reporting fps for another world.
fov = 72

# WHAT STAYS ON SCREEN, because 5.10 has no lever for it: the touch overlay draws
# a magnifier button and a bare `Aux1` label over the right third of the 640x480
# playfield (visible in docs/device/low.png and high.png, both taken on the
# panel). 5.10 builds the magnifier unconditionally, whether or not the player can
# zoom, so setting the zoom_fov property to 0 silences what the button does
# without removing the button: a tap on it still arrives as `zoom` and turns the
# view left, and a tap on the label arrives as `aux1` and turns it right. Both
# zones also swallow look and dig taps where a right thumb naturally lands.
#
# The one lever this version has is `virtual_joystick_triggers_aux1`, which drops
# the Aux1 button by moving aux1 onto the virtual joystick — the camera would then
# turn right whenever a movement drag left the joystick's centre, which trades a
# dead label for a live misfire. Not taken, and not verified on the panel either.
# There is no equivalent for the magnifier at all: moving or removing a touch
# button needs the layout editor added in 5.11, and Debian trixie carries 5.10
# (docs/decisions.md, "The on-screen jump/sneak buttons: hidden, because 5.10
# cannot move them").

# aux1 only accelerates movement when fast_move is on and the player has the
# `fast` privilege. The setting is off here and the privilege is not granted
# (see player.lua), so aux1 carries the button and nothing else.
fast_move = false

# Hotbar slots are the digits 1-8 on the keyboard, and a tap on the bar itself.

# --- Select: the hotbar, one way round -----------------------------------------
# One button that cycles forward and wraps at the end, rather than a pair. Eight
# slots is a short enough ring that going the long way round costs nothing, and
# it leaves Start free for chat.
#
# Select is the PrintScreen/SysRq key. The engine knows this key under two names;
# KEY_SNAPSHOT was tried first and did nothing, so KEY_PRINT is the one in use.
# If neither reaches the game, the culprit is the desktop rather than the engine —
# compositors commonly grab PrintScreen for screenshots before an application
# sees it.
keymap_hotbar_next = KEY_PRINT

# EXPLICITLY unbound, and this is the whole reason the line exists rather than
# being deleted: hotbar_previous defaults to KEY_KEY_B, which is the sneak button
# on this device. Leaving the setting out does not leave the action unbound — it
# hands it back to the default, which is exactly how B came to both crouch and
# change the selected block. An engine default is not an absence.
keymap_hotbar_previous =

# --- Start: chat ---------------------------------------------------------------
# Escape is the pause menu and cannot be rebound, so Start carries chat — on this
# device the only reason to want a keyboard mid-game (/time, /music).
keymap_chat = KEY_PAUSE

# Inventory stays on the keyboard's own I. The PocketTerm has a full keyboard, and
# spending a face button on something a key already does is the wrong trade.
