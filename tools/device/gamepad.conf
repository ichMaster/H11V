# H11V — the PocketTerm35's gamepad buttons.
#
# DEVICE ONLY. Appended by tools/deploy_to_term35.sh and never by run_local.sh,
# because these bindings take W/A/S/D away and the Mac needs them.
#
# What the buttons actually are, established on this hardware rather than
# assumed: every one of them sends an ordinary keyboard key. There is no BTN_*
# anywhere, /proc/bus/input/devices lists no joystick, and the twelve gamepad
# codes the keyboard advertises in its capability bitmap are never used. So this
# is a keymap, not a joystick configuration, and Luanti needs no joypad path.
#
#   A 30 · B 48 · X 45 · Y 21 · L 38 · R 19  — each sends the letter on its face
#   Select 99  = SysRq  (KEY_SNAPSHOT)
#   Start  119 = Pause  (KEY_PAUSE)
#   D-pad 103/108/105/106 = the arrow keys
#
# Luanti binds one key per action — there is no secondary binding — so these
# REPLACE the desktop keys rather than joining them. That is why the file is
# device-only: on the panel the D-pad is how you move, and on the Mac W/A/S/D is.

# --- movement: the D-pad ------------------------------------------------------
# Takes W/A/S/D off these actions. Note that A and D were LEFT and RIGHT by
# default, which is exactly why A can now be jump without a collision.
keymap_forward = KEY_UP
keymap_backward = KEY_DOWN
keymap_left = KEY_LEFT
keymap_right = KEY_RIGHT

# --- the face buttons ---------------------------------------------------------
# A at the bottom of the diamond is jump, as it is on every handheld ever made.
keymap_jump = KEY_KEY_A
keymap_sneak = KEY_KEY_B
# X places and Y digs: the two things this game is, on the two buttons a right
# thumb reaches without moving.
keymap_place = KEY_KEY_X
keymap_dig = KEY_KEY_Y

# --- shoulders ----------------------------------------------------------------
# Cycling the hotbar is what shoulder buttons are for, and it is the one action
# that is genuinely awkward on a touchscreen.
keymap_hotbar_previous = KEY_KEY_L
keymap_hotbar_next = KEY_KEY_R

# --- Select / Start -----------------------------------------------------------
# Escape is the pause menu and is not rebindable, so Start gets chat — which on
# this device is how /time and /music are reached, and the only reason to want a
# keyboard mid-game.
keymap_inventory = KEY_SNAPSHOT
keymap_chat = KEY_PAUSE
