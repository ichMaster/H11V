# H11V — shared device settings.
#
# Everything every graphics profile agrees on. tools/deploy_to_term35.sh
# concatenates this with one device-{low,mid,high}.conf and ships the result as
# the single config the device runs with, so a profile switch is a redeploy
# rather than an edit on the device.
#
# Not here on purpose: viewing_range, smooth_lighting, mip_map, waving, bloom,
# fps_max. Those ARE the profile.

# --- the panel ---------------------------------------------------------------
# 640x480 native, one render pixel per panel pixel. Any other size resamples
# hand-drawn 32x32 art, which is the one thing this project cannot afford.
fullscreen = true
screen_w = 640
screen_h = 480
vsync = false

# --- the GPU ----------------------------------------------------------------
# opengl, and only opengl. Debian trixie's luanti 5.10 is the legacy Irrlicht
# build: linked against libX11 with no SDL, no EGL and no GLESv2. The binary
# still CONTAINS the strings "ogles2" and "opengl3", so those look like valid
# choices — and the engine rejects both at runtime with "Invalid video_driver",
# then falls through to an X11 device and dies asking for a DISPLAY.
#
# The rendering path is therefore GLX -> XWayland -> Mesa V3D, which is still
# hardware: `DISPLAY=:0 glxinfo -B` reports V3D 7.1.7.0 with direct rendering.
# See docs/decisions.md; ARCHITECTURE.md "The GPU path" describes this.
video_driver = opengl

# --- touch ------------------------------------------------------------------
# The default touch interaction style draws NO crosshair at all, and the M0 scope
# promises one. 5.10 spells it touch_use_crosshair; 5.12+ renamed it to
# touch_interaction_style = tap_crosshair. Both are set: an unknown setting is
# ignored, so this is portable across the version skew between Mac and device.
touch_controls = true
# The crosshair decides the target, not where the finger lands — so a tap
# anywhere acts on whatever is being aimed at. Without this the default style
# draws no crosshair at all and the M0 scope promises one.
touch_use_crosshair = true
touchscreen_threshold = 20

# Verified against the 5.10 binary's own setting list: touch_interaction_style
# does not exist in this version and was being silently ignored. Removed rather
# than left in as forward-compatibility for 5.12 — a setting that does nothing
# reads as a setting that does something, and the next person to debug touch
# would start with the one line that cannot be the cause.
#
# The engine's own help, for the record, because it is not what anyone expects:
#     - slide finger: look around
#     - tap:          place/punch/use
#     - long tap:     dig/use

# The touch overlay builds a button per bound key and hides any whose binding is
# empty, logging "Unknown key '' for 'rangeselect'". Harmless, but a warning at
# every launch is a warning nobody reads by the third one — and view range is
# worth a button on a device whose whole question is what it can draw.
# Deliberately NOT bound. R is the right shoulder button on this device and
# belongs to hotbar_next (tools/device/gamepad.conf); binding view range to the
# same key would be a silent conflict, which is worse than the harmless warning
# the engine logs about rangeselect having no key.
# keymap_rangeselect = KEY_KEY_R

# --- readable at arm's length ------------------------------------------------
# Minimum UI element 48 px because a finger is not a mouse.
hud_scaling = 1.4
# The HUD and the GUI are scaled separately on purpose, and they want opposite
# things on this panel.
#
# hud_scaling stays at 1.4: the hotbar is a touch target and must stay big enough
# for a finger.
#
# gui_scaling comes down to 1.0. The engine's own dialogs are laid out for a
# desktop, and at 1.4 they are simply WIDER than 640 px — the pause menu's
# controls-help column ran off the right edge of the screen with no way to scroll
# to it. That is a layout problem, not a text problem: font_size fixes labels
# overlapping inside their cells, and does nothing for a panel that does not fit.
# Both were wrong here, which is why both changed.
gui_scaling = 1.0
# 20 was too large for the engine's own dialogs. The Change Keys list is two
# columns of labels on a 640x480 panel, and at 20 the text overflowed its cells
# and ran together — unreadable, and the first thing a player opens to find out
# how to move. Lowering font_size rather than gui_scaling is the targeted fix:
# gui_scaling scales the layout and the text together, so it moves the overlap
# around instead of removing it, and it would shrink the touch targets too.
font_size = 14
chat_font_size = 14

# --- reproducibility ----------------------------------------------------------
# A fixed seed, so the three graphics profiles are measured on the same terrain.
# Without it each --fresh deploy generates a different world and the profiles are
# compared against different amounts of geometry — which is not a comparison.
fixed_map_seed = 20260913

# --- server step --------------------------------------------------------------
# The default 0.09 s is fine for a server full of players and wrong for a game
# whose camera is turned by a mod. Two things run on this clock:
#
#   the turn itself — at 0.09 s the view moves 11 times a second, which reads as
#   stepping rather than turning;
#   the FOV correction that cancels the zoom the L button triggers — the client
#   predicts the zoom instantly and the server undoes it on its next step, so
#   the step length IS the length of the visible flash.
#
# 0.02 s puts both at 50 Hz. It costs server CPU the device demonstrably has:
# v0.7 measured 2-3 ms of drawtime against a 33 ms budget, on four cores, with no
# entities and no ABMs to step.
dedicated_server_step = 0.02

# --- things v0 does not use ---------------------------------------------------
enable_damage = false
creative_mode = true
enable_particles = false
show_debug = false
